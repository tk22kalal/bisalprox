# /etc/nginx/sites-available/bisalpro.conf
# Put BOTH app instances behind a real load balancer so public traffic
# actually uses the HA pair instead of pinning to 8080.
#
# Enable with:
#   ln -sf /etc/nginx/sites-available/bisalpro.conf /etc/nginx/sites-enabled/bisalpro.conf
#   nginx -t && systemctl reload nginx

upstream bisalprox_backend {
    # Round-robin across both instances. If one is unhealthy (Telegram flood,
    # crash, restart), max_fails/fail_timeout takes it out of rotation so NEW
    # requests land on the healthy node. (Does not migrate an in-flight stream.)
    #
    # Prefer least_conn for long-lived streaming connections so a busy node
    # is not handed more concurrent streams than a idle one.
    least_conn;
    server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8081 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Shared proxy settings for both domains
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name web.afrahtafreeh.site webx.afrahtafreeh.site;

    # --- Let’s Encrypt / redirect to HTTPS (keep your existing certbot block) ---
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name web.afrahtafreeh.site webx.afrahtafreeh.site;

    # --- TLS (point these at your existing certs) ---
    ssl_certificate     /etc/letsencrypt/live/afrahtafreeh.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/afrahtafreeh.site/privkey.pem;

    # Large streams: allow big/slow responses without premature 504s
    client_max_body_size    0;
    proxy_read_timeout      3600s;
    proxy_send_timeout      3600s;
    send_timeout            3600s;
    proxy_connect_timeout   30s;

    # Retry the OTHER backend if one fails to respond / errors out
    proxy_next_upstream       error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 30s;

    # Media / stream paths: stream bytes straight through, no buffering
    location ~ ^/(watch/|thumb/|[0-9]) {
        proxy_pass http://bisalprox_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range             $http_range;
        proxy_set_header If-Range          $http_if_range;

        proxy_buffering         off;
        proxy_request_buffering off;
    }

    # Everything else (prepare page, /api/generate, /api/download, /)
    location / {
        proxy_pass http://bisalprox_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
